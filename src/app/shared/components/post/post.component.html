<div class="row">
  <div class="col-md-6 offset-md-3" *ngIf="postObj">
    <mat-card class="mt-4 mat-elevation-z8">
      <mat-card-title>{{ postObj.title }}</mat-card-title>
      <mat-card-content>{{ postObj.content }}</mat-card-content>
      <mat-card-actions>
        <button routerLink="edit" mat-button color="primary">EDIT</button>
        <button (click)="onRemove()" mat-button color="warn">DELETE</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
